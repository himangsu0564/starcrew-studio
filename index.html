<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Starcrew Studio | Parallel World</title>

    <meta name="description" content="Explore the mystery of the Parallel World with Starcrew Studio. Download the official PDF and meet the Guardians of Balance.">
    <meta name="keywords" content="Starcrew Studio, Parallel World, Guardians of Balance, Adventure Story, John, Alex, Maria, Sam">
    <meta name="author" content="Starcrew Studio">

    <meta property="og:title" content="Starcrew Studio | Parallel World">
    <meta property="og:description" content="Join the adventure and discover the legend of the Guardians.">
    <meta property="og:image" content="https://himangsu0564.github.io/starcrew-studio/starcrew%20logo.jpg">
    <meta property="og:url" content="https://himangsu0564.github.io/starcrew-studio/">
    <meta property="og:type" content="website">

    <link rel="icon" href="starcrew logo.jpg" type="image/jpeg">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root { 
            --primary-blue: #00d4ff; 
            --bg-dark: #0a0a0c; 
            --card-bg: #16161a; 
            --text-light: #e0e0e0; 
        }

        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-light); 
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Profile Menu - Added to your UI */
        .profile-container {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 10000;
        }

        #profileBtn {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid var(--primary-blue);
            color: var(--primary-blue);
            padding: 8px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            backdrop-filter: blur(5px);
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #profileDropdown {
            display: none;
            position: absolute;
            top: 45px;
            right: 0;
            background: #16161a;
            border: 1px solid var(--primary-blue);
            border-radius: 10px;
            width: 220px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            flex-direction: column;
        }

        #userDisplayName {
            padding: 12px 15px;
            color: white;
            font-weight: bold;
            border-bottom: 1px solid #333;
            font-size: 0.95rem;
            background: rgba(0, 212, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .dropdown-item {
            background: transparent;
            border: none;
            color: white;
            padding: 12px 15px;
            cursor: pointer;
            text-align: left;
            font-size: 0.9rem;
            transition: 0.2s;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dropdown-item:hover { background: rgba(0, 212, 255, 0.1); }
        .dropdown-item.delete { color: #ff4b4b; border-top: 1px solid #333; }

        /* Original Header UI */
        header {
            height: 60vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        h1 { font-size: 3.5rem; margin-bottom: 10px; text-shadow: 0 0 20px var(--primary-blue); color: white; }
        
        .nav-links {
            display: flex;
            gap: 20px;
            background: rgba(22, 22, 26, 0.8);
            padding: 15px 30px;
            border-radius: 50px;
            margin-top: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-links a { color: var(--text-light); text-decoration: none; font-weight: 500; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .nav-links a:hover { color: var(--primary-blue); }

        .btn-download {
            background: var(--primary-blue);
            color: black;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; padding: 40px 10%; }
        .char-card { background: var(--card-bg); padding: 30px; border-radius: 15px; text-align: center; border: 1px solid #333; transition: 0.3s; text-decoration: none; color: white; }
        .char-card:hover { border-color: var(--primary-blue); transform: translateY(-5px); }

        /* Original Thanks Modal */
        #thanksModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 20000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--primary-blue);
            text-align: center;
            max-width: 400px;
        }
    </style>
</head>
<body>

<div class="profile-container">
    <button id="profileBtn">
        <i class="fas fa-user-circle"></i> Profile <i class="fas fa-chevron-down"></i>
    </button>
    <div id="profileDropdown">
        <div id="userDisplayName">
            <i class="fas fa-robot"></i> 
            <span id="nameText">Loading...</span>
        </div>
        <button class="dropdown-item" id="logoutBtn">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>
        <button class="dropdown-item delete" id="deleteAccountBtn">
            <i class="fas fa-trash-alt"></i> Delete Account
        </button>
    </div>
</div>

<header>
    <h1>STARCREW STUDIO</h1>
    <p style="font-size: 1.2rem; letter-spacing: 2px;">THE ADVENTURE OF THE PARALLEL WORLD</p>
    
    <div class="nav-links">
        <a href="characters.html"><i class="fas fa-users"></i> Guardians</a>
        <a href="map.html"><i class="fas fa-map-marked-alt"></i> Interactive Map</a>
        <a href="artifacts.html"><i class="fas fa-gem"></i> Artifacts</a>
        <a href="quiz.html"><i class="fas fa-question-circle"></i> Quiz</a>
        <a href="contact.html"><i class="fas fa-envelope"></i> Contact</a>
    </div>
</header>

<section style="text-align: center; padding: 80px 20px;">
    <h2>Begin Your Journey</h2>
    <a href="adventure.pdf" class="btn-download" download onclick="showThanks()">
        <i class="fas fa-file-download"></i> DOWNLOAD FULL PDF
    </a>
</section>

<section style="padding: 60px 10%; text-align: center;">
    <h2>The Guardians of Balance</h2>
    <div class="grid">
        <a href="characters.html" class="char-card"><i class="fas fa-crown" style="color:var(--primary-blue); font-size: 2.5rem;"></i><h3>John</h3></a>
        <a href="characters.html" class="char-card"><i class="fas fa-chess-knight" style="color:var(--primary-blue); font-size: 2.5rem;"></i><h3>Alex</h3></a>
        <a href="characters.html" class="char-card"><i class="fas fa-heart" style="color:var(--primary-blue); font-size: 2.5rem;"></i><h3>Maria</h3></a>
        <a href="characters.html" class="char-card"><i class="fas fa-shield-alt" style="color:var(--primary-blue); font-size: 2.5rem;"></i><h3>Sam</h3></a>
    </div>
</section>

<div id="thanksModal">
    <div class="modal-content">
        <h2 style="color:var(--primary-blue)">Adventure Started!</h2>
        <p>Thank you for downloading. The parallel world awaits.</p>
        <button class="btn-download" onclick="closeThanks()" style="padding:10px 30px; margin-top:20px;">Close</button>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyOogHmf1Ffhg__-Cc-LrN013-QCMssq0",
    authDomain: "starcrew-login.firebaseapp.com",
    projectId: "starcrew-login",
    storageBucket: "starcrew-login.firebasestorage.app",
    messagingSenderId: "1009769555234",
    appId: "1:1009769555234:web:83ebdf5fbc2a0313e1f17b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // 1. Gatekeeper & Username Display
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "login.html";
    } else {
      document.getElementById('nameText').innerText = user.displayName || "Explorer";
    }
  });

  // 2. Dropdown Logic
  const profileBtn = document.getElementById('profileBtn');
  const dropdown = document.getElementById('profileDropdown');
  
  profileBtn.onclick = (e) => {
    e.stopPropagation();
    dropdown.style.display = (dropdown.style.display === 'flex') ? 'none' : 'flex';
  };

  document.onclick = () => dropdown.style.display = 'none';

  // 3. Logout
  document.getElementById('logoutBtn').onclick = () => {
    signOut(auth).then(() => { window.location.href = "login.html"; });
  };

  // 4. Fixed Delete Account
  document.getElementById('deleteAccountBtn').onclick = async () => {
    const user = auth.currentUser;
    if (!user) return;

    if (confirm("ARE YOU SURE? This will permanently delete your account.")) {
      try {
        await deleteUser(user);
        window.location.href = "login.html";
      } catch (error) {
        if (error.code === 'auth/requires-recent-login') {
          alert("Security: Please logout and login again to verify your identity before deleting.");
        } else {
          alert("Error: " + error.message);
        }
      }
    }
  };
</script>

<script>
    function showThanks() { document.getElementById('thanksModal').style.display = 'flex'; }
    function closeThanks() { document.getElementById('thanksModal').style.display = 'none'; }
</script>

</body>
</html>
