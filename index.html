<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starcrew Studio | Parallel World</title>
    <link rel="icon" href="starcrew logo.jpg">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- ✨ Futuristic Font -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root { --neon: #00d4ff; --dark: #050505; }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #0a0a0f, #050505);
            color: white;
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* 🌌 HERO */
        .hero {
            height: 65vh;
            background:
                linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.9)),
                url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1350');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid var(--neon);
        }

        .hero h1 {
            font-size: 3.8rem;
            letter-spacing: 6px;
            margin: 0;
            font-weight: 900;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px var(--neon); }
            to { text-shadow: 0 0 30px var(--neon), 0 0 60px var(--neon); }
        }

        .hero p {
            color: #aaa;
            letter-spacing: 2px;
            margin-top: 10px;
            font-size: 0.95rem;
        }

        /* 👤 NAVBAR */
        .navbar {
            position: absolute;
            top: 25px;
            right: 30px;
            z-index: 100;
        }

        .profile-dropdown { position: relative; }

        .profile-btn {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            border: 1px solid var(--neon);
            color: var(--neon);
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .profile-btn:hover {
            background: var(--neon);
            color: black;
            box-shadow: 0 0 15px var(--neon);
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: rgba(17, 17, 21, 0.95);
            backdrop-filter: blur(12px);
            min-width: 200px;
            border: 1px solid var(--neon);
            border-radius: 12px;
            margin-top: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
            z-index: 1000;
        }

        .dropdown-content.show {
            display: block;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-header {
            padding: 15px 20px;
            color: #eee;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #222;
        }

        .dropdown-content a {
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            text-align: left;
            transition: 0.2s;
        }

        .dropdown-content a:hover {
            background: #1a1a1a;
            padding-left: 25px;
        }

        .delete-opt {
            color: #ff4b4b !important;
            border-top: 1px solid #222;
        }

        /* 🔘 NAV PILL */
        .nav-pill {
            display: flex;
            gap: 15px;
            margin: -35px auto 0;
            justify-content: center;
            position: relative;
            z-index: 10;
            background: rgba(15, 15, 20, 0.6);
            backdrop-filter: blur(15px);
            padding: 12px 25px;
            border-radius: 50px;
            border: 1px solid #333;
            width: fit-content;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }

        .nav-item {
            color: #eee;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
            padding: 10px 18px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--neon);
            transform: translateY(-2px);
        }

        /* 🚀 BUTTON */
        .btn-main {
            background: linear-gradient(45deg, var(--neon), #00aaff);
            color: black;
            border: none;
            padding: 16px 45px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
        }

        .btn-main:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.5);
        }

        h2 {
            font-size: 2.4rem;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="profile-dropdown">
            <button class="profile-btn" id="profileBtn">
                <i class="fas fa-robot"></i> <span id="btn-name">Explorer</span>
                <i class="fas fa-chevron-down" style="font-size: 0.7rem;"></i>
            </button>

            <div class="dropdown-content" id="dropdownMenu">
                <div class="user-header">
                    <i class="fas fa-robot"></i> <span id="display-username">Explorer</span>
                </div>

                <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                <a href="#" id="deleteAccBtn" class="delete-opt">
                    <i class="fas fa-trash"></i> Delete Account
                </a>
            </div>
        </div>
    </div>

    <div class="hero">
        <h1>STARCREW STUDIO</h1>
        <p>THE ADVENTURE OF THE PARALLEL WORLD</p>
    </div>

    <div class="nav-pill">
        <a href="characters.html" class="nav-item"><i class="fas fa-users"></i> Guardians</a>
        <a href="map.html" class="nav-item"><i class="fas fa-map"></i> Interactive Map</a>
        <a href="artifacts.html" class="nav-item"><i class="fas fa-gem"></i> Artifacts</a>
        <a href="quiz.html" class="nav-item"><i class="fas fa-question-circle"></i> Quiz</a>
        <a href="contact.html" class="nav-item"><i class="fas fa-envelope"></i> Contact</a>
    </div>

    <div style="padding: 120px 20px;">
        <h2>Begin Your Journey</h2>
        <a href="story.pdf" class="btn-main" download="Starcrew_Studio_Full_Story">
            <i class="fas fa-file-pdf"></i> DOWNLOAD FULL STORY
        </a>
    </div>

<!-- 🔥 Firebase (UNCHANGED) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAyOogHmf1Ffhg__-Cc-LrN013-QCMssq0",
    authDomain: "starcrew-login.firebaseapp.com",
    projectId: "starcrew-login"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, (user) => {
    if (user) {
        document.getElementById('btn-name').innerText = user.displayName || "explorer";
        document.getElementById('display-username').innerText = user.displayName || "explorer";
    } else {
        window.location.href = "login.html";
    }
});

document.getElementById('logoutBtn').onclick = (e) => {
    e.preventDefault();
    signOut(auth).then(() => { window.location.href = "login.html"; });
};

document.getElementById('deleteAccBtn').onclick = async (e) => {
    e.preventDefault();
    const user = auth.currentUser;
    if (!user) return;

    if(confirm("Are you sure? This will delete your account.")) {
        try {
            const username = user.displayName.toLowerCase();
            const nameRef = doc(db, "usernames", username);
            await deleteDoc(nameRef);
            await deleteUser(user);
            window.location.href = "login.html";
        } catch (error) {
            alert("Please re-login before deleting.");
        }
    }
};
</script>

<script>
const profileBtn = document.getElementById('profileBtn');
const dropdownMenu = document.getElementById('dropdownMenu');

profileBtn.addEventListener('click', () => {
    dropdownMenu.classList.toggle('show');
});

window.addEventListener('click', (e) => {
    if (!profileBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
        dropdownMenu.classList.remove('show');
    }
});
</script>

</body>
</html>
