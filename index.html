<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starcrew Studio | Parallel World</title>
    <link rel="icon" href="starcrew logo.jpg" type="image/jpeg">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root { 
            --primary-blue: #00d4ff; 
            --bg-dark: #0a0a0c; 
            --card-bg: #16161a; 
            --text-light: #e0e0e0; 
        }

        body { 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-light); 
            line-height: 1.6;
        }

        /* Profile Menu Styling */
        .profile-container {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 10000;
        }

        #profileBtn {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid var(--primary-blue);
            color: var(--primary-blue);
            padding: 8px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #profileDropdown {
            display: none;
            position: absolute;
            top: 45px;
            right: 0;
            background: #16161a;
            border: 1px solid var(--primary-blue);
            border-radius: 10px;
            width: 220px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            flex-direction: column;
        }

        #userDisplayName {
            padding: 12px 15px;
            color: white;
            font-weight: bold;
            border-bottom: 1px solid #333;
            font-size: 0.95rem;
            background: rgba(0, 212, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .dropdown-item {
            background: transparent;
            border: none;
            color: white;
            padding: 12px 15px;
            cursor: pointer;
            text-align: left;
            font-size: 0.9rem;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dropdown-item:hover { background: rgba(0, 212, 255, 0.1); }
        .dropdown-item.delete { color: #ff4b4b; border-top: 1px solid #333; }

        /* Original UI Elements */
        header {
            height: 60vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        h1 { font-size: 3.5rem; text-shadow: 0 0 20px var(--primary-blue); margin: 0; }
        .nav-links { display: flex; gap: 20px; margin-top: 20px; }
        .nav-links a { color: white; text-decoration: none; border: 1px solid #333; padding: 10px 20px; border-radius: 50px; }
    </style>
</head>
<body>

<div class="profile-container">
    <button id="profileBtn">
        <i class="fas fa-user-circle"></i> Profile <i class="fas fa-chevron-down"></i>
    </button>
    <div id="profileDropdown">
        <div id="userDisplayName">
            <i class="fas fa-robot"></i> 
            <span id="nameText">Loading...</span>
        </div>
        <button class="dropdown-item" id="logoutBtn">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>
        <button class="dropdown-item delete" id="deleteAccountBtn">
            <i class="fas fa-trash-alt"></i> Delete Account
        </button>
    </div>
</div>

<header>
    <h1>STARCREW STUDIO</h1>
    <div class="nav-links">
        <a href="characters.html">Guardians</a>
        <a href="map.html">Map</a>
        <a href="quiz.html">Quiz</a>
    </div>
</header>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyOogHmf1Ffhg__-Cc-LrN013-QCMssq0",
    authDomain: "starcrew-login.firebaseapp.com",
    projectId: "starcrew-login",
    storageBucket: "starcrew-login.firebasestorage.app",
    messagingSenderId: "1009769555234",
    appId: "1:1009769555234:web:83ebdf5fbc2a0313e1f17b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "login.html";
    } else {
      document.getElementById('nameText').innerText = user.displayName || "Explorer";
    }
  });

  const profileBtn = document.getElementById('profileBtn');
  const dropdown = document.getElementById('profileDropdown');
  
  profileBtn.onclick = (e) => {
    e.stopPropagation();
    dropdown.style.display = dropdown.style.display === 'flex' ? 'none' : 'flex';
  };

  document.onclick = () => dropdown.style.display = 'none';

  // Logout
  document.getElementById('logoutBtn').onclick = () => {
    signOut(auth).then(() => { window.location.href = "login.html"; });
  };

  // FIXED Delete Account Logic
  document.getElementById('deleteAccountBtn').onclick = async () => {
    const user = auth.currentUser;
    if (!user) return;

    const confirmFirst = confirm("ARE YOU SURE? This will permanently delete your Starcrew Explorer account.");
    
    if (confirmFirst) {
      try {
        await deleteUser(user);
        alert("Account successfully removed from the Parallel World.");
        window.location.href = "login.html";
      } catch (error) {
        if (error.code === 'auth/requires-recent-login') {
          alert("SECURITY ALERT: To delete your account, you must log out and sign back in immediately to prove it's really you.");
        } else {
          alert("Error: " + error.message);
        }
      }
    }
  };
</script>

</body>
</html>
