<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian Access | Starcrew Studio</title>
    <link rel="icon" href="starcrew logo.jpg">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --neon: #00d4ff; --dark: #050505; }
        body { background: var(--dark); color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        canvas { position: fixed; top: 0; left: 0; z-index: -1; }
        
        .login-card { 
            background: #111115; padding: 40px; border: 1px solid var(--neon); border-radius: 20px; 
            width: 340px; text-align: center; box-shadow: 0 0 30px rgba(0, 212, 255, 0.15); z-index: 10; 
        }
        h2 { letter-spacing: 3px; margin-bottom: 25px; color: var(--neon); }
        
        input { 
            width: 100%; padding: 12px; margin: 10px 0; background: #0a0a0c; border: 1px solid #333; 
            color: white; border-radius: 8px; box-sizing: border-box; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--neon); box-shadow: 0 0 10px rgba(0, 212, 255, 0.3); }
        
        .action-btn { 
            width: 100%; padding: 14px; margin-top: 20px; background: var(--neon); color: black; 
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4); }
        .action-btn:disabled { background: #555; cursor: not-allowed; }
        
        .toggle-link { margin-top: 20px; font-size: 0.85rem; color: #888; cursor: pointer; display: block; }
        .toggle-link b { color: var(--neon); }
        
        #msg-box { margin-top: 15px; font-size: 0.85rem; min-height: 20px; }
    </style>
</head>
<body>

    <canvas id="bg"></canvas>

    <div class="login-card">
        <h2 id="form-title">GUARDIAN LOGIN</h2>
        <div id="reg-fields" style="display: none;">
            <input type="text" id="explorer-name" placeholder="Explorer Name (Username)">
        </div>
        <input type="text" id="user-input" placeholder="Email or Explorer Name">
        <input type="password" id="password" placeholder="Password">
        
        <button class="action-btn" id="action-btn">Sign In</button>
        
        <span class="toggle-link" id="toggle-form">
            New Guardian? <b>Register Here</b>
        </span>
        
        <div id="msg-box"></div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAyOogHmf1Ffhg__-Cc-LrN013-QCMssq0",
        authDomain: "starcrew-login.firebaseapp.com",
        projectId: "starcrew-login"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let isLogin = true;

    // Toggle logic
    document.getElementById('toggle-form').onclick = () => {
        isLogin = !isLogin;
        document.getElementById('form-title').innerText = isLogin ? "GUARDIAN LOGIN" : "GUARDIAN REGISTER";
        document.getElementById('reg-fields').style.display = isLogin ? "none" : "block";
        document.getElementById('user-input').placeholder = isLogin ? "Email or Explorer Name" : "Email Address";
        document.getElementById('action-btn').innerText = isLogin ? "Sign In" : "Register";
        document.getElementById('toggle-form').innerHTML = isLogin ? "New Guardian? <b>Register Here</b>" : "Have an account? <b>Login Here</b>";
    };

    document.getElementById('action-btn').onclick = async () => {
        const userInput = document.getElementById('user-input').value.trim();
        const pass = document.getElementById('password').value;
        const chosenName = document.getElementById('explorer-name').value.trim();
        const msgBox = document.getElementById('msg-box');
        const btn = document.getElementById('action-btn');

        if(!userInput || !pass) {
            msgBox.style.color = "#ff4b4b";
            msgBox.innerText = "Please fill in all fields.";
            return;
        }

        btn.disabled = true;
        msgBox.innerText = "Connecting to Parallel World...";
        msgBox.style.color = "var(--neon)";

        try {
            if (isLogin) {
                let emailToAuth = userInput;

                // LOGIN LOGIC: Check if input is Username or Email
                if (!userInput.includes("@")) {
                    const nameRef = doc(db, "usernames", userInput.toLowerCase());
                    const nameSnap = await getDoc(nameRef);
                    
                    if (nameSnap.exists()) {
                        emailToAuth = nameSnap.data().email;
                    } else {
                        throw new Error("Explorer Name not found.");
                    }
                }

                await signInWithEmailAndPassword(auth, emailToAuth, pass);
                window.location.href = "index.html";

            } else {
                // REGISTRATION LOGIC
                if (!chosenName) throw new Error("Please choose an Explorer Name.");
                
                const nameRef = doc(db, "usernames", chosenName.toLowerCase());
                const nameSnap = await getDoc(nameRef);
                
                if (nameSnap.exists()) {
                    throw new Error("That Name is already taken!");
                }

                const userCred = await createUserWithEmailAndPassword(auth, userInput, pass);
                
                // Save to Firestore
                await setDoc(nameRef, {
                    username: chosenName,
                    email: userInput,
                    uid: userCred.user.uid,
                    joinedAt: new Date()
                });

                // Update Profile
                await updateProfile(userCred.user, { displayName: chosenName });

                msgBox.style.color = "#00ff88";
                msgBox.innerText = "Welcome, Guardian!";
                setTimeout(() => { window.location.href = "index.html"; }, 1000);
            }
        } catch (err) {
            msgBox.style.color = "#ff4b4b";
            msgBox.innerText = err.message;
            btn.disabled = false;
        }
    };

    /* Animation */
    const canvas = document.getElementById("bg");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    let stars = Array(150).fill().map(() => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 1.5,
        speed: Math.random() * 0.5
    }));
    function draw() {
        ctx.fillStyle = "#050505"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "white";
        stars.forEach(s => {
            ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
            s.y += s.speed; if(s.y > canvas.height) s.y = 0;
        });
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
