<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardian Access | Starcrew Studio</title>
<link rel="icon" href="starcrew logo.jpg">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<style>
:root { 
    --neon: #00d4ff; 
    --dark: #050505; 
    --glass: rgba(255,255,255,0.05);
}

/* BODY */
body { 
    background: radial-gradient(circle at center, #0a0a0f, #000);
    color: white; 
    font-family: 'Segoe UI', sans-serif; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
    margin: 0; 
    overflow: hidden; 
}

/* LIGHT FOLLOW EFFECT */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at var(--x,50%) var(--y,50%), rgba(0,212,255,0.15), transparent 40%);
    pointer-events: none;
    z-index: 0;
}

/* CANVAS */
canvas { 
    position: fixed; 
    top: 0; 
    left: 0; 
    z-index: -1; 
}

/* CARD */
.login-card { 
    position: relative;
    backdrop-filter: blur(30px);
    background: var(--glass);
    padding: 45px; 
    border-radius: 20px; 
    width: 350px; 
    text-align: center; 
    z-index: 10;

    border: 1px solid rgba(0,212,255,0.4);

    box-shadow: 
        0 0 60px rgba(0, 212, 255, 0.35),
        inset 0 0 40px rgba(0,212,255,0.1);

    animation: fadeIn 0.8s ease, floatCard 4s ease-in-out infinite;
}

/* PORTAL GLOW BEHIND */
.login-card::before {
    content: "";
    position: absolute;
    inset: -60px;
    background: radial-gradient(circle, rgba(0,212,255,0.2), transparent 70%);
    z-index: -1;
}

/* TITLE */
h2 { 
    letter-spacing: 3px; 
    margin-bottom: 25px; 
    color: var(--neon); 
    text-shadow: 0 0 20px rgba(0,212,255,0.8);
    animation: glowPulse 2s infinite alternate;
}

/* INPUTS */
input { 
    width: 100%; 
    padding: 12px; 
    margin: 12px 0; 
    background: #0a0a0c; 
    border: 1px solid #333; 
    color: white; 
    border-radius: 10px; 
    outline: none; 
    transition: 0.3s;
    box-sizing: border-box;
}

input:focus { 
    border-color: var(--neon); 
    box-shadow: 0 0 20px rgba(0,212,255,0.7);
    transform: scale(1.04);
}

/* PASSWORD WRAPPER & TOGGLE */
.pass-wrapper {
    position: relative;
    width: 100%;
}

.toggle-password {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #666;
    transition: 0.3s;
}

.toggle-password:hover {
    color: var(--neon);
}

/* BUTTON */
.action-btn { 
    position: relative;
    overflow: hidden;
    width: 100%; 
    padding: 14px; 
    margin-top: 20px; 
    background: linear-gradient(45deg, #00d4ff, #00ffcc);
    color: black; 
    border: none; 
    border-radius: 10px; 
    font-weight: bold; 
    cursor: pointer; 
    transition: 0.3s;
}

.action-btn:hover { 
    transform: translateY(-5px) scale(1.05); 
    box-shadow: 0 25px 50px rgba(0, 212, 255, 0.7);
}

/* RIPPLE EFFECT */
.action-btn::after {
    content: "";
    position: absolute;
    width: 0;
    height: 0;
    background: rgba(255,255,255,0.5);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

.action-btn:active::after {
    width: 200px;
    height: 200px;
    transition: 0.4s;
}

/* TOGGLE */
.toggle-link { 
    margin-top: 20px; 
    font-size: 0.85rem; 
    color: #aaa; 
    cursor: pointer; 
}

.toggle-link:hover { color: white; }
.toggle-link b { color: var(--neon); }

/* MESSAGE */
#msg-box { 
    margin-top: 15px; 
    font-size: 0.85rem; 
}

/* ANIMATIONS */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px);}
    to { opacity: 1; transform: translateY(0);}
}

@keyframes glowPulse {
    from { text-shadow: 0 0 10px var(--neon);}
    to { text-shadow: 0 0 30px var(--neon);}
}

@keyframes floatCard {
    0%,100% { transform: translateY(0);}
    50% { transform: translateY(-10px);}
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="login-card">
    <h2 id="form-title">GUARDIAN LOGIN</h2>
    <div id="reg-fields" style="display: none;">
        <input type="text" id="explorer-name" placeholder="Explorer Name (Username)">
    </div>
    <input type="text" id="user-input" placeholder="Email or Explorer Name">
    
    <div class="pass-wrapper">
        <input type="password" id="password" placeholder="Password">
        <i class="fa-solid fa-eye toggle-password" id="eye-icon"></i>
    </div>
    
    <button class="action-btn" id="action-btn">Sign In</button>
    
    <span class="toggle-link" id="toggle-form">
        New Guardian? <b>Register Here</b>
    </span>
    
    <div id="msg-box"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAyOogHmf1Ffhg__-Cc-LrN013-QCMssq0",
    authDomain: "starcrew-login.firebaseapp.com",
    projectId: "starcrew-login"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let isLogin = true;

// Password Toggle Logic
const passwordInput = document.getElementById('password');
const eyeIcon = document.getElementById('eye-icon');

eyeIcon.onclick = () => {
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    eyeIcon.classList.toggle('fa-eye');
    eyeIcon.classList.toggle('fa-eye-slash');
};

document.getElementById('toggle-form').onclick = () => {
    isLogin = !isLogin;
    document.getElementById('form-title').innerText = isLogin ? "GUARDIAN LOGIN" : "GUARDIAN REGISTER";
    document.getElementById('reg-fields').style.display = isLogin ? "none" : "block";
    document.getElementById('user-input').placeholder = isLogin ? "Email or Explorer Name" : "Email Address";
    document.getElementById('action-btn').innerText = isLogin ? "Sign In" : "Register";
    document.getElementById('toggle-form').innerHTML = isLogin ? "New Guardian? <b>Register Here</b>" : "Have an account? <b>Login Here</b>";
};

document.getElementById('action-btn').onclick = async () => {
    const userInput = document.getElementById('user-input').value.trim();
    const pass = document.getElementById('password').value;
    const chosenName = document.getElementById('explorer-name').value.trim();
    const msgBox = document.getElementById('msg-box');
    const btn = document.getElementById('action-btn');

    if(!userInput || !pass) {
        msgBox.style.color = "#ff4b4b";
        msgBox.innerText = "Please fill in all fields.";
        return;
    }

    btn.disabled = true;
    msgBox.innerText = "Connecting to Parallel World...";
    msgBox.style.color = "var(--neon)";

    try {
        if (isLogin) {
            let emailToAuth = userInput;

            if (!userInput.includes("@")) {
                const nameRef = doc(db, "usernames", userInput.toLowerCase());
                const nameSnap = await getDoc(nameRef);
                
                if (nameSnap.exists()) {
                    emailToAuth = nameSnap.data().email;
                } else {
                    throw new Error("Explorer Name not found.");
                }
            }

            await signInWithEmailAndPassword(auth, emailToAuth, pass);
            window.location.href = "index.html";

        } else {
            if (!chosenName) throw new Error("Please choose an Explorer Name.");
            
            // Check if Explorer Name contains @
            if (chosenName.includes("@")) {
                throw new Error("Explorer Name cannot contain '@' symbol.");
            }

            const nameRef = doc(db, "usernames", chosenName.toLowerCase());
            const nameSnap = await getDoc(nameRef);
            
            if (nameSnap.exists()) {
                throw new Error("That Name is already taken!");
            }

            const userCred = await createUserWithEmailAndPassword(auth, userInput, pass);
            
            await setDoc(nameRef, {
                username: chosenName,
                email: userInput,
                uid: userCred.user.uid,
                joinedAt: new Date()
            });

            await updateProfile(userCred.user, { displayName: chosenName });

            msgBox.style.color = "#00ff88";
            msgBox.innerText = "Welcome, Guardian!";
            setTimeout(() => { window.location.href = "index.html"; }, 1000);
        }
    } catch (err) {
        msgBox.style.color = "#ff4b4b";
        msgBox.innerText = err.message;
        btn.disabled = false;
    }
};

/* CURSOR LIGHT FOLLOW */
window.addEventListener("mousemove", e=>{
    document.body.style.setProperty('--x', e.clientX + "px");
    document.body.style.setProperty('--y', e.clientY + "px");
});

/* BACKGROUND PARTICLES */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = Array(100).fill().map(()=>({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    vx: (Math.random()-0.5)*0.5,
    vy: (Math.random()-0.5)*0.5,
    size: Math.random()*2
}));

function draw(){
    ctx.fillStyle="#050505";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    particles.forEach(p=>{
        p.x+=p.vx;
        p.y+=p.vy;

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fillStyle="rgba(0,212,255,0.7)";
        ctx.shadowBlur=10;
        ctx.shadowColor="#00d4ff";
        ctx.fill();

        if(p.x<0||p.x>canvas.width) p.vx*=-1;
        if(p.y<0||p.y>canvas.height) p.vy*=-1;
    });

    requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
