<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guardian Access | Starcrew Studio</title>
<link rel="icon" href="starcrew logo.jpg">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<style>
:root { --neon: #00d4ff; --dark: #0a0a0c; }

body {
  background: var(--dark);
  color: white;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  overflow: hidden;
}

canvas { position: fixed; top: 0; left: 0; z-index: -1; }

.login-card {
  background: #16161a;
  padding: 40px;
  border: 1px solid var(--neon);
  border-radius: 15px;
  width: 320px;
  text-align: center;
  box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
  z-index: 10;
}

.input-group { position: relative; width: 100%; margin: 10px 0; }

input {
  width: 100%;
  padding: 12px;
  background: #1a1a20;
  border: 1px solid #333;
  color: white;
  border-radius: 5px;
  box-sizing: border-box;
  transition: 0.3s;
}

input:focus { outline: none; border-color: var(--neon); box-shadow: 0 0 10px var(--neon); }

.toggle-pass {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  color: #888;
}

.btn {
  width: 100%;
  padding: 12px;
  background: var(--neon);
  border: none;
  color: black;
  font-weight: bold;
  cursor: pointer;
  border-radius: 5px;
  margin-top: 15px;
  transition: 0.3s;
}

.btn:hover { box-shadow: 0 0 20px var(--neon); transform: scale(1.02); }

.mode-toggle { font-size: 12px; color: #888; margin-top: 15px; cursor: pointer; text-decoration: underline; }

#msg { font-size: 12px; margin-top: 10px; min-height: 15px; color: #ff4b4b; }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="login-card">
  <img src="starcrew logo.jpg" style="width: 80px; border-radius: 50%; border: 2px solid var(--neon); margin-bottom: 10px;">
  <h2 id="title" style="color: var(--neon); margin-bottom: 20px;">Guardian Login</h2>
  
  <div class="input-group" id="userWrapper" style="display: none;">
    <input type="text" id="username" placeholder="Guardian Name *">
  </div>

  <div class="input-group">
    <input type="email" id="email" placeholder="Explorer Email *">
  </div>
  
  <div class="input-group">
    <input type="password" id="password" placeholder="Access Code *">
    <i class="fas fa-eye toggle-pass" id="eyeIcon"></i>
  </div>

  <button class="btn" id="actionBtn">Sign In</button>
  <div class="mode-toggle" id="toggleMode">New Explorer? Create Account</div>
  <p id="msg"></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyOogHmf1Ffhg__-Cc-LrN013-QCMssq0",
    authDomain: "starcrew-login.firebaseapp.com",
    projectId: "starcrew-login",
    storageBucket: "starcrew-login.firebasestorage.app",
    messagingSenderId: "1009769555234",
    appId: "1:1009769555234:web:83ebdf5fbc2a0313e1f17b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const passInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');
  const userWrapper = document.getElementById('userWrapper');
  const actionBtn = document.getElementById('actionBtn');
  const toggleBtn = document.getElementById('toggleMode');
  const title = document.getElementById('title');
  const msg = document.getElementById('msg');

  let isLogin = true;

  // 1. Password Visibility Toggle
  eyeIcon.onclick = () => {
    const isPass = passInput.type === 'password';
    passInput.type = isPass ? 'text' : 'password';
    eyeIcon.classList.toggle('fa-eye');
    eyeIcon.classList.toggle('fa-eye-slash');
  };

  // 2. Redirect if already logged in
  onAuthStateChanged(auth, (user) => {
    if (user) window.location.href = "index.html";
  });

  // 3. Switch Mode (Login vs Register)
  toggleBtn.onclick = () => {
    isLogin = !isLogin;
    title.innerText = isLogin ? "Guardian Login" : "New Explorer";
    actionBtn.innerText = isLogin ? "Sign In" : "Register";
    toggleBtn.innerText = isLogin ? "New Explorer? Create Account" : "Back to Sign In";
    userWrapper.style.display = isLogin ? 'none' : 'block';
    msg.innerText = "";
  };

  // 4. Submit Action
  actionBtn.onclick = () => {
    const email = document.getElementById('email').value;
    const pass = passInput.value;
    const username = document.getElementById('username').value;

    if (!email || !pass || (!isLogin && !username)) {
      msg.innerText = "Please fill in all marked (*) fields.";
      return;
    }

    actionBtn.disabled = true;
    actionBtn.innerText = "Processing...";

    if (isLogin) {
      signInWithEmailAndPassword(auth, email, pass)
        .then(() => window.location.href = "index.html")
        .catch(err => {
          msg.innerText = err.message;
          actionBtn.disabled = false;
          actionBtn.innerText = "Sign In";
        });
    } else {
      createUserWithEmailAndPassword(auth, email, pass)
        .then((userCred) => {
          return updateProfile(userCred.user, { displayName: username });
        })
        .then(() => window.location.href = "index.html")
        .catch(err => {
          msg.innerText = err.message;
          actionBtn.disabled = false;
          actionBtn.innerText = "Register";
        });
    }
  };

  /* Star Background */
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  let stars = Array(150).fill().map(() => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 2
  }));
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "white";
    stars.forEach(s => {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
